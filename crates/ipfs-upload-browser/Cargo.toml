[package]
name = "ipfs-upload-browser"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"

[workspace]

[dependencies]
serde_json = "1"
sha2 = "0.10"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlButtonElement", "HtmlProgressElement", "HtmlFormElement", "File", "FileList", "Blob", "Request", "RequestInit", "RequestCredentials", "RequestRedirect", "Response", "Headers", "Event", "AbortController", "AbortSignal", "Location"] }

[profile.release]
opt-level = "s"
lto = true
