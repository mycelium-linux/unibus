[package]
name = "unibus-hue"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# Standalone to avoid rebuilding unrelated workspace services on the Neo.
[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
x509-parser = { version = "0.18", default-features = false }
dcp = { git = "https://github.com/FuturePresentLabs/dcp.git", rev = "d3a1335" }
time = { version = "0.3", features = ["formatting"] }
tiny_http = "0.12"

[dev-dependencies]
tempfile = "3"
rcgen = "0.14"
