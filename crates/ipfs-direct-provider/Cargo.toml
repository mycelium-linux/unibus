[package]
name = "ipfs-direct-provider"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1"
futures-util = "0.3"
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring", "unstable-custom-transports"] }
iroh-webrtc-transport = { path = "../ipfs-direct-browser/vendor/iroh-webrtc-transport", default-features = false, features = ["native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync", "signal"] }

[profile.release]
debug = 0
