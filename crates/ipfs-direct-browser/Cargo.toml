[package]
name = "ipfs-direct-browser"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
browser-fixture = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring", "unstable-custom-transports"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
iroh-webrtc-transport = { path = "vendor/iroh-webrtc-transport", default-features = false, features = ["native"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "net", "signal", "time"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
iroh-webrtc-transport = { path = "vendor/iroh-webrtc-transport", default-features = false, features = ["browser"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlButtonElement", "HtmlProgressElement", "Response", "RequestInit", "Request", "RequestMode", "RequestCredentials", "RequestRedirect", "Headers", "Location", "UrlSearchParams", "Navigator", "console"] }

[profile.release]
opt-level = "s"
debug = 0
